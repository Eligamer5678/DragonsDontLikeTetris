name: Deploy Pages (inject firebase config)

on:
  push:
    branches: [ multiplayer ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site with injected firebase config
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          set -euo pipefail
          # prepare a clean site directory to publish
          rm -rf site || true
          mkdir site
          # copy everything except .git and github workflow files
          rsync -a --exclude='.git' --exclude='.github' ./ site/
          mkdir -p site/js/Server
          if [ -z "${FIREBASE_CONFIG_JSON:-}" ]; then
            echo "Warning: FIREBASE_CONFIG_JSON secret is empty. The published site will not include firebaseConfig.js"
          else
            # write the file without printing the secret to logs
            printf '%s' "export const firebaseConfig = ${FIREBASE_CONFIG_JSON};" > site/js/Server/firebaseConfig.js
          fi
          # safe verification: print file size (bytes) if present
          if [ -f site/js/Server/firebaseConfig.js ]; then
            size=$(wc -c < site/js/Server/firebaseConfig.js || true)
            echo "firebaseConfig.js written; size=${size} bytes"
          else
            echo "firebaseConfig.js not present"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
